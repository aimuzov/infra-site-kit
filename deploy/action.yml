name: Site deploy
description: Deploy a site on the projects server over SSH, then wait for it to answer.

inputs:
  ssh-key:
    description: Private key whose public half is in authorized_keys on the server, usually secrets.DEPLOY_SSH_KEY.
    required: true
  url:
    description: Site address to check after the deploy, e.g. https://example.com.
    required: true
  ref:
    description: Release tag to deploy, e.g. v1.2.0. Empty deploys the newest main.
    required: false
    default: ''
  health-url:
    description: Backend health address to check after the site, e.g. https://example.com/api/health. Empty skips the check.
    required: false
    default: ''
  host:
    description: Projects server.
    required: false
    default: 141.133.188.169
  known-host:
    description: "known_hosts line of the server: ssh won't trust whoever answers there."
    required: false
    default: '141.133.188.169 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINnRXayyFSNqYxBbGbHCh60Y6jUyhLT47gwSeoqQRvsd'

runs:
  using: composite
  steps:
    # Ключ в authorized_keys запускает для сайта deploy/site.sh из infra-server,
    # единственное, что передаёт ssh, -- тег релиза в качестве команды.
    # Пустой `REF` не передаём вовсе, тогда деплоится свежий main.
    #
    # Пока деплой ждёт в очереди сервера, соединение молчит,
    # keepalive держат его и замечают, если оно умерло.
    - name: Deploy on server
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        KNOWN_HOST: ${{ inputs.known-host }}
        HOST: ${{ inputs.host }}
        REF: ${{ inputs.ref }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
        chmod 600 ~/.ssh/deploy
        printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
        ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
          -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "root@$HOST" ${REF:+"$REF"}

    - name: Check site
      shell: bash
      env:
        URL: ${{ inputs.url }}
      run: |
        for i in 1 2 3 4 5; do
          curl -fsS -o /dev/null -w "%{http_code}\n" "$URL" && exit 0
          sleep 5
        done
        exit 1

    # Сайт отдаёт nginx со статикой, его ответ про бэкенд ничего не говорит.
    - name: Check backend
      if: inputs.health-url != ''
      shell: bash
      env:
        URL: ${{ inputs.health-url }}
      run: |
        for i in 1 2 3 4 5 6; do
          curl -fsS -o /dev/null -w "%{http_code}\n" "$URL" && exit 0
          sleep 5
        done
        exit 1
